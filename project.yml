name: TapCounter
options:
  bundleIdPrefix: com.edui
  deploymentTarget:
    iOS: "16.0"
targets:
  TapCounter:
    type: application
    platform: iOS
    sources: [TapCounter]
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edui.tapcounter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: NO
